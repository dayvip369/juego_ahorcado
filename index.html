<!DOCTYPE html>
<html lang="es-ES">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <title>El Ahorcado</title>
</head>

<body class="h-screen overflow-hidden bg-sky-100 font-sans">

  <div class="h-screen w-full flex items-center justify-center">

    <div class="
  relative
  w-full h-full
  sm:h-[94vh] sm:max-w-4xl
  bg-white sm:rounded-3xl
  sm:shadow-2xl sm:border-4 sm:border-yellow-300
  flex flex-col overflow-hidden
  ">

      <!-- CABECERA -->
      <header class="
        shrink-0 text-center
        bg-yellow-300
        px-2 py-1.5 sm:py-2
      ">

        <h1 class="
          text-2xl sm:text-4xl
          font-black text-purple-700
        ">
          🎮 ¡El Ahorcado!
        </h1>

        <p class="
          text-xs sm:text-sm
          font-bold text-purple-600
        ">
          ¿Puedes descubrir la palabra?
        </p>

        <button
          onclick="empezar()"
          class="
            mt-1.5
            px-5 py-1.5 sm:px-7 sm:py-2
            bg-green-500 text-white
            font-black text-sm sm:text-base
            rounded-xl
            border-b-4 border-green-700
            shadow-md
            transition-all
            hover:bg-green-400
            hover:scale-105
            hover:-translate-y-0.5
            active:translate-y-1
            active:border-b-0
          ">
          🚀 ¡Empezar!
        </button>

      </header>

      <!-- JUEGO -->
      <main class="
  relative
  flex-1 min-h-0
  flex flex-col items-center
  px-2 py-2
  sm:px-6 sm:py-2
">

        <!-- PALABRA -->
        <section class="text-center shrink-0">

          <p class="
            text-[10px] sm:text-xs
            font-black text-sky-500 uppercase
          ">
            Adivina la palabra
          </p>

          <div
            id="palabra"
            class="
              mt-1
              text-xl sm:text-3xl
              font-black
              tracking-[0.2em]
              text-purple-700
            ">
            _ _ _ _ _
          </div>

        </section>

        <!-- AHORCADO -->
        <section class="
          flex flex-col items-center
          shrink-0 mt-1
        ">

          <svg
            id="svg-ahorcado"
            class="
              w-[110px] h-[125px]
              sm:w-[160px] sm:h-[180px]
              bg-sky-50
              rounded-2xl
              border-2 border-sky-200
              shadow
            "
            viewBox="0 0 200 250">

            <line
              x1="10" y1="240"
              x2="150" y2="240"
              stroke="#475569"
              stroke-width="5"
              stroke-linecap="round"
            />

            <line
              x1="40" y1="240"
              x2="40" y2="20"
              stroke="#475569"
              stroke-width="5"
              stroke-linecap="round"
            />

            <line
              x1="40" y1="20"
              x2="120" y2="20"
              stroke="#475569"
              stroke-width="5"
              stroke-linecap="round"
            />

            <line
              x1="120" y1="20"
              x2="120" y2="50"
              stroke="#475569"
              stroke-width="5"
              stroke-linecap="round"
            />

            <circle
              id="cabeza"
              class="parte-cuerpo hidden"
              cx="120" cy="70" r="20"
              stroke="#7c3aed"
              stroke-width="5"
              fill="#fef3c7"
            />

            <line
              id="tronco"
              class="parte-cuerpo hidden"
              x1="120" y1="90"
              x2="120" y2="150"
              stroke="#7c3aed"
              stroke-width="5"
              stroke-linecap="round"
            />

            <line
              id="brazo-izq"
              class="parte-cuerpo hidden"
              x1="120" y1="110"
              x2="90" y2="130"
              stroke="#7c3aed"
              stroke-width="5"
              stroke-linecap="round"
            />

            <line
              id="brazo-der"
              class="parte-cuerpo hidden"
              x1="120" y1="110"
              x2="150" y2="130"
              stroke="#7c3aed"
              stroke-width="5"
              stroke-linecap="round"
            />

            <line
              id="pierna-izq"
              class="parte-cuerpo hidden"
              x1="120" y1="150"
              x2="90" y2="190"
              stroke="#7c3aed"
              stroke-width="5"
              stroke-linecap="round"
            />

            <line
              id="pierna-der"
              class="parte-cuerpo hidden"
              x1="120" y1="150"
              x2="150" y2="190"
              stroke="#7c3aed"
              stroke-width="5"
              stroke-linecap="round"
            />

          </svg>

          <div class="
            mt-1
            px-3 py-0.5
            bg-red-100
            rounded-full
            font-black
            text-red-600
            text-xs
          ">
            ❌ <span id="error">0/6</span>
          </div>

        </section>

        <!-- TECLADO -->
        <footer
          id="teclado"
          class="
            w-full max-w-xl
            flex flex-wrap justify-center
            gap-1
            sm:gap-1
            shrink-0
            mt-1.5
          ">
        </footer>

        <!-- RESULTADO -->
        <div
  id="resultado"
  class="
    absolute inset-0
    z-50
    hidden
    items-center justify-center
    bg-black/50
    backdrop-blur-sm
  ">
  </div>

      </main>

    </div>

  </div>

  <script src="js/palabras.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
